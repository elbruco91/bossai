<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boss Finale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: arcade screen. HUD with boss HP on top, question panel left, pixel boss right,
   trainer dial bottom-right. Single dark look, deliberately. */
:root {
  color-scheme: dark;
  --night: #0d0816;
  --glass: rgba(20, 13, 33, 0.9);
  --slot: #1d1530;
  --edge: #3a2f55;
  --ink: #ece8f7;
  --muted: #9a90b8;
  --blood: #ff2246;
  --volt: #3ef0ff;
  --gold: #ffd23f;
  --blue: #2f6bff;
  --red: #ff3b3b;
  --black: #000000;
  --f-display: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body: "Pixelify Sans", ui-monospace, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 18px;
  overflow: hidden;
}
#bg {
  position: fixed; inset: 0; width: 100%; height: 100%;
  image-rendering: pixelated; z-index: 0;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
}
.app {
  position: relative; z-index: 1; height: 100%;
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 18px;
  padding-block: 18px;
  padding-left: max(clamp(16px, 2.6vw, 40px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, 2.6vw, 40px), env(safe-area-inset-right, 0px));
}

/* ---------- HUD ---------- */
.hud {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: clamp(14px, 2vw, 28px);
  background: var(--glass); border: 4px solid var(--edge);
  box-shadow: 6px 6px 0 var(--black);
  padding: 12px 18px;
}
.boss-name { font-family: var(--f-display); font-size: clamp(13px, 1.25vw, 20px); color: var(--blood); letter-spacing: 0.04em; text-shadow: 3px 3px 0 var(--black); }
.boss-sub { font-size: 15px; color: var(--muted); margin-top: 6px; }
.hp { display: flex; align-items: center; gap: 14px; min-width: 0; }
.hp-bar {
  position: relative; flex: 1; height: 28px; min-width: 80px;
  background: var(--slot); border: 3px solid var(--black);
  box-shadow: 0 0 0 3px var(--edge);
}
.hp-fill, .hp-ghost { position: absolute; inset: 0 auto 0 0; width: 100%; }
.hp-ghost { background: var(--ink); opacity: 0.85; transition: width 0.5s steps(8) 0.45s; }
.hp-fill {
  background: var(--blood);
  box-shadow: inset 0 5px 0 rgba(255,255,255,0.28), inset 0 -5px 0 rgba(0,0,0,0.3);
  transition: width 0.25s steps(5);
}
.hp-bar::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 3px), var(--black) calc(10% - 3px) 10%);
}
.hp-num { font-family: var(--f-display); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qcount { font-family: var(--f-display); font-size: 12px; color: var(--gold); white-space: nowrap; letter-spacing: 0.06em; }

/* ---------- Arena ---------- */
.arena { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 24px; min-height: 0; }
.panel {
  background: var(--glass); border: 4px solid var(--edge);
  box-shadow: 6px 6px 0 var(--black);
  padding: clamp(18px, 2.2vw, 34px);
  display: flex; flex-direction: column; gap: 20px;
  min-height: 0; overflow: auto;
}
.stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; min-height: 0; }
.robot-wrap { position: relative; display: grid; place-items: center; min-height: 0; }
#robot { image-rendering: pixelated; display: block; max-width: 100%; }
.popups { position: absolute; inset: 0; pointer-events: none; }
.pop {
  position: absolute; left: 50%; top: 28%;
  font-family: var(--f-display); font-size: clamp(26px, 3vw, 46px);
  color: var(--gold); text-shadow: 4px 4px 0 var(--black);
  transform: translate(-50%, 0);
  animation: pop 1.1s steps(11) forwards;
}
.pop.zero { color: var(--muted); }
@keyframes pop {
  0% { transform: translate(-50%, 10px) scale(0.6); opacity: 1; }
  20% { transform: translate(-50%, -10px) scale(1.15); }
  70% { opacity: 1; }
  100% { transform: translate(-50%, -70px) scale(1); opacity: 0; }
}

/* trainer dial: no labels on purpose */
.controls {
  justify-self: end; display: flex; align-items: center; gap: 14px;
  background: var(--glass); border: 3px solid var(--edge);
  box-shadow: 4px 4px 0 var(--black);
  padding: 8px 12px;
}
#gauge { width: 150px; height: auto; display: block; }
#needle { transition: transform 0.45s cubic-bezier(.3,1.6,.5,1); transform-origin: 90px 92px; }
.knobs { display: flex; flex-direction: column; gap: 10px; }
.knob {
  width: 40px; height: 40px; border-radius: 50%; cursor: pointer; padding: 0;
  border: 3px solid var(--black);
  box-shadow: inset -4px -4px 0 rgba(0,0,0,0.35), inset 4px 4px 0 rgba(255,255,255,0.35), 0 4px 0 var(--black);
}
.knob:active { transform: translateY(3px); box-shadow: inset -4px -4px 0 rgba(0,0,0,0.35), inset 4px 4px 0 rgba(255,255,255,0.35), 0 1px 0 var(--black); }
.knob.blue { background: var(--blue); }
.knob.red { background: var(--red); }

/* ---------- Panel content ---------- */
.eyebrow { font-family: var(--f-display); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 0; line-height: 1.6; }
.title { font-family: var(--f-display); font-size: clamp(28px, 3.4vw, 54px); line-height: 1.15; margin: 0; color: var(--blood); text-shadow: 5px 5px 0 var(--black); text-wrap: balance; }
.title.win { color: var(--volt); }
.lede { font-size: clamp(18px, 1.4vw, 22px); line-height: 1.45; margin: 0; max-width: 34em; color: var(--ink); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--slot); border: 3px solid var(--edge); padding: 14px 16px; }
.field-label { font-size: 20px; font-weight: 600; }
.note { margin: 0; color: var(--muted); font-size: 17px; }
.note strong { color: var(--gold); font-weight: 600; }

.qtext { font-size: clamp(22px, 2vw, 32px); line-height: 1.28; font-weight: 600; margin: 0; text-wrap: balance; }
.opts { display: grid; gap: 12px; }
.opt {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  background: var(--slot); border: 3px solid var(--edge); padding: 10px 12px;
}
.opt.voted { border-color: var(--gold); }
.letter {
  font-family: var(--f-display); font-size: 14px; width: 38px; height: 38px;
  display: grid; place-items: center; background: var(--edge); color: var(--ink);
}
.opt.voted .letter { background: var(--gold); color: var(--black); }
.otext { font-size: clamp(17px, 1.45vw, 22px); line-height: 1.3; min-width: 0; }
.counter { display: flex; align-items: center; gap: 6px; }
.step {
  width: 38px; height: 38px; font-family: var(--f-display); font-size: 16px; line-height: 1;
  background: var(--night); color: var(--ink); border: 3px solid var(--edge); cursor: pointer;
  box-shadow: 0 3px 0 var(--black);
}
.step:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--black); }
.step:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.num { min-width: 2.6ch; text-align: center; font-family: var(--f-display); font-size: 18px; color: var(--gold); font-variant-numeric: tabular-nums; }
.counter.big .step { width: 48px; height: 48px; font-size: 20px; }
.counter.big .num { font-size: 26px; min-width: 3ch; }

.tally { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: auto; }
.tally-info { display: grid; gap: 8px; min-width: 0; }
.tally-text { font-family: var(--f-display); font-size: 11px; color: var(--muted); }
.tally-text b { color: var(--gold); font-weight: 400; }
.pips { display: flex; flex-wrap: wrap; gap: 4px; max-width: 340px; }
.pip { width: 12px; height: 12px; background: var(--slot); border: 2px solid var(--edge); }
.pip.on { background: var(--gold); border-color: var(--black); }
.attack {
  font-family: var(--f-display); font-size: 14px; letter-spacing: 0.06em;
  padding: 16px 22px; cursor: pointer;
  background: var(--blood); color: var(--ink); border: 3px solid var(--black);
  box-shadow: 5px 5px 0 var(--black);
}
.attack:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--black); }
.attack:disabled { background: var(--slot); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: 5px 5px 0 var(--black); }
.panel.locked button { pointer-events: none; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--slot); border: 3px solid var(--edge); padding: 14px 16px; display: grid; gap: 10px; }
.stat-k { font-family: var(--f-display); font-size: 10px; color: var(--muted); letter-spacing: 0.06em; line-height: 1.5; }
.stat-v { font-family: var(--f-display); font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }

button:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }

/* ---------- Narrow screens ---------- */
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .hud { grid-template-columns: 1fr auto; }
  .hp { grid-column: 1 / -1; grid-row: 2; }
  .arena { grid-template-columns: minmax(0, 1fr); }
  .stage { order: -1; height: 46vh; min-height: 260px; }
  .panel { overflow: visible; }
}
/* ---------- Screen effects ---------- */
:root {
  --fx-white: #ffffff;
  --fx-red-core: rgba(255, 34, 70, 0.15);
  --fx-red-edge: rgba(255, 34, 70, 0.7);
  --fx-vig: rgba(255, 34, 70, 0.42);
}
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 6; animation: fxfade 0.8s ease-out forwards; }
.fx.white { background: var(--fx-white); animation-duration: 0.9s; }
.fx.soft { background: var(--fx-white); opacity: 0.5; animation-duration: 0.35s; }
.fx.red { background: radial-gradient(ellipse at 70% 45%, var(--fx-red-core) 20%, var(--fx-red-edge)); animation-duration: 1.1s; }
.fx.vig { background: radial-gradient(ellipse at center, transparent 45%, var(--fx-vig)); }
@keyframes fxfade { from { opacity: 1; } to { opacity: 0; } }
.app.quake { animation: quake 0.35s steps(6); }
.app.quake-big { animation: quake 0.8s steps(14); }
@keyframes quake {
  0% { transform: translate(0, 0); }
  15% { transform: translate(-9px, 5px); }
  30% { transform: translate(8px, -7px); }
  45% { transform: translate(-6px, -3px); }
  60% { transform: translate(7px, 6px); }
  75% { transform: translate(-4px, 3px); }
  100% { transform: translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .app.quake, .app.quake-big { animation: none; }
  .pop { animation-duration: 1.4s; }
  #needle, .hp-fill, .hp-ghost { transition: none; }
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="hud">
    <div class="boss-id">
      <div class="boss-name" id="bossName"></div>
      <div class="boss-sub" id="bossSub"></div>
    </div>
    <div class="hp" role="img" id="hpBox">
      <div class="hp-bar"><div class="hp-ghost" id="hpGhost"></div><div class="hp-fill" id="hpFill"></div></div>
      <div class="hp-num" id="hpNum"></div>
    </div>
    <div class="qcount" id="qCount"></div>
  </header>

  <main class="arena">
    <section class="panel" id="panel" aria-live="polite"></section>
    <section class="stage" id="stage">
      <div class="robot-wrap" id="robotWrap">
        <canvas id="robot" role="img" aria-label="Il boss, un robot in pixel art"></canvas>
        <div class="popups" id="popups"></div>
      </div>
      <div class="controls">
        <svg id="gauge" viewBox="0 0 180 108" aria-hidden="true"></svg>
        <div class="knobs">
          <button class="knob blue" id="up" aria-label="Alza la soglia"></button>
          <button class="knob red" id="down" aria-label="Abbassa la soglia"></button>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="questions.js"></script>
<script>
(() => {
"use strict";

/* ===================== CONFIG & STATE ===================== */
const CFG = window.BOSS_CONFIG || { questions: [] };
const Q = CFG.questions || [];
const LETTERS = ["A", "B", "C", "D"];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = {
  phase: "setup",            // setup | play | dying | win | lose
  players: CFG.defaultPlayers || 15,
  level: CFG.defaultLevel || 8,
  damage: 0, qi: 0, played: 0,
  votes: [0, 0, 0, 0],
  busy: false
};
const totalVotes = () => state.players * Q.length;
const maxHp = () => Math.max(1, Math.round(totalVotes() * state.level / 10));
const hp = () => Math.max(0, maxHp() - state.damage);
const sumVotes = () => state.votes.reduce((a, b) => a + b, 0);
const pad = n => String(n).padStart(2, "0");

/* ===================== PIXEL HELPERS ===================== */
const PAL = {
  K: "#0e0a16", D: "#26213a", M: "#46405f", L: "#726b93", H: "#aaa4c8",
  G: "#140f20", R: "#ff2246", r: "#7d0c26", E: "#ffb0bd",
  O: "#ff7a1a", Y: "#ffd23f", A: "#fff2b3", W: "#ffffff",
  C: "#3ef0ff", c: "#1287a8", V: "#3a2a8a", B: "#05030a", X: "#33252b"
};
const col = c => PAL[c] || c;
function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function rng(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function linePts(x0, y0, x1, y1) {
  const out = [];
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) {
    out.push([x0, y0]);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
  return out;
}
let g; // active 2d context
const R = (x, y, w, h, c) => { g.fillStyle = col(c); g.fillRect(x, y, w, h); };
const P = (x, y, c) => R(x, y, 1, 1, c);
function disc(cx, cy, r, c) {          // continuous centre, pixel-centre test
  for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++)
    for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r * r) P(x, y, c);
    }
}

/* ===================== SPRITE BUILDER ===================== */
// The boss is built on a 96x96 grid from shaded polygons: every part gets an
// automatic 1px outline, a lit top-left edge and a shaded bottom-right edge.
const N = 96;
let S;
const idx = (x, y) => y * N + x;
const inB = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const sset = (x, y, c) => { if (inB(x, y)) S[idx(x, y)] = c; };
const sget = (x, y) => (inB(x, y) ? S[idx(x, y)] : null);
const mx = x => N - 1 - x;
const mirror = pts => pts.map(([x, y]) => [N - x, y]);

function polyMask(pts, keep) {
  const m = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) {
    const py = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      if ((ay <= py && by > py) || (by <= py && ay > py)) xs.push(ax + (py - ay) * (bx - ax) / (by - ay));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2)
      for (let x = Math.ceil(xs[k] - 0.5); x <= Math.floor(xs[k + 1] - 0.5); x++)
        if (inB(x, y) && (!keep || keep(x, y))) m[idx(x, y)] = 1;
  }
  return m;
}
function ellMask(cx, cy, rx, ry) {
  const m = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
    if (dx * dx + dy * dy <= 1) m[idx(x, y)] = 1;
  }
  return m;
}
function part(m, base, hi, lo) {
  const on = (x, y) => inB(x, y) && m[idx(x, y)];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!m[idx(x, y)]) continue;
    let c;
    if (!on(x - 1, y) || !on(x + 1, y) || !on(x, y - 1) || !on(x, y + 1)) c = "K";
    else if (!on(x, y - 2) || !on(x - 2, y)) c = hi;
    else if (!on(x, y + 2) || !on(x + 2, y)) c = lo;
    else c = base;
    S[idx(x, y)] = c;
  }
  return m;
}
const shape = (pts, base, hi, lo, keep) => part(polyMask(pts, keep), base, hi, lo);
const sdisc = (cx, cy, r, c) => {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
    if (dx * dx + dy * dy <= r * r) S[idx(x, y)] = c;
  }
};

const PIV = [29, 46];
const BLADES = [
  [[27, 36], [3, 0], [11, 5], [32, 42]],
  [[26, 41], [0, 14], [3, 23], [31, 46]],
  [[26, 45], [0, 33], [2, 43], [30, 50]],
  [[27, 49], [0, 55], [7, 62], [30, 53]]
];
const CORE = [48, 55];

// Stage 0 intact · 1 scratched · 2 cracked · 3 crippled · 4 wrecked · 5 destroyed
function buildStage(s) {
  S = new Array(N * N).fill(null);
  const hd = s >= 5 ? 6 : 0;
  const meta = { circuits: [], mouth: [], hd };

  // ----- wings -----
  const wingLen = (side, i) => {
    if (s >= 5) return 9;
    if (side === 0) { if (s >= 2 && i <= 1) return 9; if (s >= 1 && i === 3) return 21; }
    else if (s >= 4 && i <= 2) return 9;
    return 99;
  };
  BLADES.forEach((b, i) => [0, 1].forEach(side => {
    const pts = side ? mirror(b) : b;
    const piv = side ? [N - PIV[0], PIV[1]] : PIV;
    const L = wingLen(side, i);
    const m = shape(pts, "M", "L", "D", (x, y) => Math.hypot(x + 0.5 - piv[0], y + 0.5 - piv[1]) < L);
    const a = [(pts[0][0] + pts[3][0]) / 2, (pts[0][1] + pts[3][1]) / 2];
    const z = [(pts[1][0] + pts[2][0]) / 2, (pts[1][1] + pts[2][1]) / 2];
    const lp = linePts(Math.round(a[0]), Math.round(a[1]), Math.round(z[0]), Math.round(z[1]))
      .filter(([x, y]) => inB(x, y) && m[idx(x, y)] && S[idx(x, y)] !== "K");
    lp.forEach(([x, y]) => sset(x, y, "r"));
    meta.circuits.push({ side, i, pts: lp, dead: (side === 0 && s >= 3) || s >= 5 });
  }));

  // ----- thrusters & abdomen -----
  shape([[28, 66], [36, 66], [35, 76], [29, 76]], "D", "M", "G");
  shape(mirror([[28, 66], [36, 66], [35, 76], [29, 76]]), "D", "M", "G");
  shape([[37, 68], [59, 68], [55, 84], [41, 84]], "M", "L", "D");
  for (const y of [73, 77, 81]) for (let x = 38; x <= 57; x++) if (sget(x, y) === "M" || sget(x, y) === "L") sset(x, y, "D");
  shape([[41, 83], [55, 83], [57, 90], [39, 90]], "D", "M", "G");

  // ----- arms -----
  const arm = side => {
    const f = side ? mirror : (p => p);
    const lost = side === 0 && s >= 3;
    shape(f([[20, 48], [28, 48], [27, 60], [20, 60]]), "M", "L", "D", lost ? ((x, y) => y < 57) : null);
    if (lost) return;
    shape(f([[15, 59], [29, 59], [27, 73], [17, 73]]), "M", "L", "D");
    [[[14, 72], [19, 72], [17, 86]], [[19, 72], [24, 72], [22, 89]], [[24, 72], [29, 72], [27, 85]]]
      .forEach((p, k) => { if (side === 1 && s >= 4 && k === 1) return; shape(f(p), "L", "H", "M"); });
  };
  arm(0); arm(1);

  // ----- torso -----
  shape([[23, 40], [73, 40], [68, 56], [60, 70], [36, 70], [28, 56]], "M", "L", "D");
  for (const y of [44, 46, 48]) for (let x = 29; x <= 35; x++) { sset(x, y, "G"); sset(mx(x), y, "G"); }
  for (const [x, y] of [[27, 42], [33, 62]]) { sset(x, y, "H"); sset(mx(x), y, "H"); }
  sdisc(CORE[0], CORE[1], 8.5, "K"); sdisc(CORE[0], CORE[1], 7.4, "G");

  // ----- pauldrons -----
  const pauldron = side => {
    const f = side ? mirror : (p => p);
    [[[12, 38], [15, 24], [19, 37]], [[20, 36], [24, 26], [27, 35]]].forEach((p, k) => {
      if (side === 0 && s >= 3 && k === 1) return;
      if (side === 1 && s >= 1 && k === 0) { shape(f(p), "L", "H", "M", (x, y) => y >= 31); return; }
      shape(f(p), "L", "H", "M");
    });
    shape(f([[9, 36], [30, 33], [35, 41], [31, 51], [13, 52], [7, 44]]), "L", "H", "M");
    for (let x = 11; x <= 31; x++) { const xx = side ? mx(x) : x; if (sget(xx, 47) && sget(xx, 47) !== "K") sset(xx, 47, "M"); }

  // ----- neck & head -----
  shape([[41, 36], [55, 36], [54, 44], [42, 44]], "D", "M", "G");
  const hy = p => p.map(([x, y]) => [x, y + hd]);
  const HORN = [[26, 26], [13, 5], [32, 16]];
  shape(hy(HORN), "L", "H", "M", s >= 1 ? ((x, y) => y >= 12 + hd) : null);
  if (s < 4) shape(hy(mirror(HORN)), "L", "H", "M");
  shape(hy([[33, 13], [31, 2], [39, 12]]), "L", "H", "M");
  shape(hy(mirror([[33, 13], [31, 2], [39, 12]])), "L", "H", "M");
  shape(hy([[42, 13], [48, -2], [54, 13]]), "L", "H", "M");
  shape(hy([[31, 11], [65, 11], [71, 22], [67, 35], [57, 43], [39, 43], [29, 35], [25, 22]]), "M", "L", "D");
  part(ellMask(48, 24 + hd, 10.5, 7.5), "G", "G", "G");
  linePts(32, 14 + hd, 42, 19 + hd).forEach(([x, y]) => {
    sset(x, y, "K"); sset(mx(x), y, "K"); sset(x, y + 1, "D"); sset(mx(x), y + 1, "D");
  });
  for (const y of [28, 30, 32]) for (let x = 30; x <= 33; x++) { sset(x, y + hd, "G"); sset(mx(x), y + hd, "G"); }
  for (let y = 33; y <= 40; y++) for (let x = 38; x <= 57; x++)
    sset(x, y + hd, (y === 33 || y === 40 || x === 38 || x === 57) ? "K" : "G");
  for (let x = 39; x <= 55; x += 4) { for (let k = 0; k < 3; k++) if (x + k <= 56) sset(x + k, 34 + hd, "H"); sset(x + 1, 35 + hd, "H"); }
  for (let x = 41; x <= 53; x += 4) {
    if (s >= 2 && x === 45) continue;
    for (let k = 0; k < 3; k++) sset(x + k, 39 + hd, "L");
    sset(x + 1, 38 + hd, "L");
  }
  for (const y of [35, 36]) { sset(39, y + hd, "H"); sset(56, y + hd, "H"); }

  // ----- damage (cumulative) -----
  const cuts = new Set();
  const cutRagged = (x, y, w, h, seed) => {
    const rand = rng(seed);
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) {
      const edge = xx === x || yy === y || xx === x + w - 1 || yy === y + h - 1;
      if (!edge || rand() < 0.55) cuts.add(xx + "," + yy);
    }
  };
  const hole = (cx, cy, rx, ry, seed) => {
    const rand = rng(seed);
    for (let y = Math.floor(cy - ry - 2); y <= cy + ry + 2; y++) for (let x = Math.floor(cx - rx - 2); x <= cx + rx + 2; x++) {
      const d = ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2;
      if (d <= 1) sset(x, y, rand() < 0.15 ? "X" : "B");
      else if (d <= 1.9 && rand() < 0.75 && sget(x, y)) sset(x, y, "K");

  };
  const scorch = (x, y, w, h, seed) => {
    const rand = rng(seed);
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++)
      if (sget(xx, yy) && sget(xx, yy) !== "K" && rand() < 0.7) sset(xx, yy, "X");

  const crack = (pts) => pts.forEach(([x, y]) => { if (sget(x, y)) sset(x, y, "K"); });

  if (s >= 1) {
    crack([[18, 38], [19, 39], [19, 40], [20, 41], [21, 42], [21, 43], [20, 44], [20, 45], [21, 46], [21, 47]]);
    linePts(59, 14 + hd, 63, 20 + hd).forEach(([x, y]) => { if (sget(x, y) && sget(x, y) !== "K") sset(x, y, "X"); });
    scorch(59, 26 + hd, 4, 3, 3);
  }
  if (s >= 2) {
    hole(61, 50, 3.6, 2.6, 11);
    sset(60, 50, "O"); sset(62, 51, "Y"); sset(61, 52, "O");
    scorch(34, 16 + hd, 4, 2, 7);
    sset(19, 60, "O"); sset(18, 61, "Y"); sset(18, 62, "O");
  }
  if (s >= 3) {

    for (const [x, y, c] of [[21, 57, "O"], [22, 58, "Y"], [23, 59, "O"], [24, 58, "Y"], [25, 60, "O"], [22, 60, "O"], [21, 61, "Y"]]) sset(x, y, c);

    scorch(26, 40, 6, 4, 61); scorch(64, 44, 5, 3, 67); scorch(44, 74, 6, 3, 71); scorch(70, 60, 5, 5, 73);
  }
  if (cuts.size) {
    cuts.forEach(k => { const [x, y] = k.split(",").map(Number); if (inB(x, y)) S[idx(x, y)] = null; });
    cuts.forEach(k => {
      const [x, y] = k.split(",").map(Number);
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([ax, ay]) => {
        const nx = x + ax, ny = y + ay;
        if (!cuts.has(nx + "," + ny) && sget(nx, ny)) sset(nx, ny, "K");

  // finishing metadata
  meta.circuits.forEach(c => { c.pts = c.pts.filter(([x, y]) => sget(x, y) === "r"); });
  for (let y = 34; y <= 39; y++) for (let x = 39; x <= 56; x++) if (sget(x, y + hd) === "G") meta.mouth.push([x, y + hd]);

  // rasterise
  const cv = mk(N, N), cx = cv.getContext("2d"), img = cx.createImageData(N, N);
  for (let i = 0; i < N * N; i++) {
    const c = S[i]; if (!c) continue;
    const h = col(c);
    img.data[i * 4] = parseInt(h.slice(1, 3), 16);
    img.data[i * 4 + 1] = parseInt(h.slice(3, 5), 16);
    img.data[i * 4 + 2] = parseInt(h.slice(5, 7), 16);
    img.data[i * 4 + 3] = 255;

  cx.putImageData(img, 0, 0);
  if (s >= 5) {

}
const STAGES = [0, 1, 2, 3, 4, 5].map(buildStage);
const STAGE_SPOT = [null, [20, 44], [61, 50], [23, 58], [62, 11]];

/* ===================== SCENE ===================== */
const SW = 136, SH = 124, OX = 20, OY = 8, GROUND = 119;
const scene = mk(SW, SH), sctx = scene.getContext("2d");
const frame = mk(N, N), fctx = frame.getContext("2d");
const view = document.getElementById("robot"), vctx = view.getContext("2d");
const anim = {
  tick: 0, shake: 0, flash: 0, laugh: 0, dying: 0, intro: 0, charge: 0, laser: 0,
  forced: null, lastStage: 0, dx: 0, dy: 0, fall: 0, vfall: 0, landed: false
};
let parts = [];
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

function stageNow() {
  if (anim.forced !== null) return anim.forced;
  if (state.phase === "setup") return 0;
  const ratio = hp() / maxHp();
  if (ratio > 0.8) return 0;
  if (ratio > 0.6) return 1;

const dormant = () => state.phase === "setup";
const angry = () => anim.laugh > 0 || anim.charge > 0 || anim.laser > 0 || state.phase === "lose";

function emit(type, lx, ly, extra) {
  const rnd = Math.random;
  const p = { type, x: OX + lx + anim.dx, y: OY + ly + anim.dy, vx: 0, vy: 0, gr: 0, life: 10, s: 1 };
  if (type === "smoke") { p.vx = (rnd() - 0.65) * 0.35; p.vy = -0.35 - rnd() * 0.25; p.life = 18 + rnd() * 16; }
  if (type === "spark") { p.vx = (rnd() - 0.5) * 2; p.vy = -0.8 - rnd() * 1.4; p.gr = 0.2; p.life = 5 + rnd() * 6; }
  if (type === "fire") { p.vx = (rnd() - 0.5) * 0.4; p.vy = -0.45 - rnd() * 0.5; p.life = 5 + rnd() * 6; p.s = rnd() < 0.4 ? 2 : 1; }
  if (type === "ember") { p.vx = (rnd() - 0.5) * 0.3; p.vy = -0.25 - rnd() * 0.35; p.life = 20 + rnd() * 20; }
  if (type === "debris") {
    p.vx = (rnd() - 0.5) * 3; p.vy = -1.4 - rnd() * 2; p.gr = 0.22; p.life = 16 + rnd() * 12;
    p.s = rnd() < 0.35 ? 2 : 1;

  }
  if (type === "dust") { p.vx = (rnd() - 0.5) * 2.4; p.vy = -0.3 - rnd() * 0.4; p.life = 14 + rnd() * 10; }
  if (type === "boom") { p.life = 10; p.r = (extra && extra.r) || (3 + Math.floor(rnd() * 5)); }
  if (type === "ring") { p.life = 16; p.r = (extra && extra.r) || 60; }
  if (type === "charge") { p.tx = OX + 48 + anim.dx; p.ty = OY + 24 + anim.dy; p.life = 10; }
  p.max = p.life;

}
const randPt = () => [12 + Math.random() * 72, 6 + Math.random() * 78];

function ambient(s) {
  const ch = p => Math.random() < p;
  if (dormant()) { if (ch(0.15)) emit("ember", 14 + Math.random() * 68, 80 + Math.random() * 10); return; }
  if (s >= 5) {
    if (ch(0.8)) emit("smoke", 14 + Math.random() * 68, 30 + Math.random() * 40);

  if (s >= 3) { if (ch(0.5)) emit("fire", 61, 49); if (ch(0.35)) emit("spark", 23, 59); if (ch(0.4)) emit("smoke", 22, 58); if (ch(0.3)) emit("smoke", 60, 38); }

function drawFrame(s) {

    }

}

function drawAura(s) {
  if (s >= 5 && anim.dying === 0) return;
  const t = anim.tick;
  let I = dormant() ? 0.35 : 0.78 + 0.22 * Math.sin(t * 0.3);
  if (s >= 3 && Math.random() < 0.2) I *= 0.45;

  for (let y = Math.max(0, Math.floor(cy - ry)); y < Math.min(SH, cy + ry); y++)
    for (let x = Math.max(0, Math.floor(cx - rx)); x < Math.min(SW, cx + rx); x++) {

function drawOrbiters(s, front) {

function drawLaser() {

function drawParticles() {
  g = sctx;

    anim.vfall += 0.7; anim.fall += anim.vfall;
    const floor = GROUND - (OY + 90);
    if (anim.fall >= floor) {
      anim.fall = floor; anim.landed = true;
      for (let i = 0; i < 26; i++) emit("dust", 20 + Math.random() * 56, 89);
      emit("boom", 30, 85, { r: 6 }); emit("boom", 66, 85, { r: 6 });
      quake(true);
    }
  }

  ambient(s);
  drawFrame(s);

  g = sctx;
  sctx.clearRect(0, 0, SW, SH);
  drawAura(s);
  const shadowW = 44 - Math.max(0, anim.dy);
  R(OX + 48 - shadowW / 2, GROUND, shadowW, 1, "rgba(0,0,0,0.5)");
  R(OX + 48 - shadowW / 2 + 6, GROUND + 1, shadowW - 12, 1, "rgba(0,0,0,0.3)");
  drawOrbiters(s, false);
  sctx.drawImage(frame, OX + anim.dx, OY + anim.dy);
  drawOrbiters(s, true);
  drawFlames(s);
  drawLaser();
  drawParticles();

  const dpr = window.devicePixelRatio || 1;
  vctx.imageSmoothingEnabled = false;
  vctx.clearRect(0, 0, view.width, view.height);
  vctx.drawImage(scene, 0, 0, view.width, view.height);

  // ----- timers -----
  if (anim.shake > 0) anim.shake--;
  if (anim.flash > 0) anim.flash--;
  if (anim.laugh > 0) anim.laugh--;
  if (anim.intro > 0) {
    anim.intro--;
    if (anim.intro === 11) { quake(true); fx("red"); anim.shake = 6; }
    if (anim.intro > 11 && anim.intro < 18) for (let i = 0; i < 3; i++) emit("spark", 48 + (Math.random() - 0.5) * 20, 24);
  }
  if (anim.charge > 0) {
    anim.charge--;
    for (let i = 0; i < 4; i++) emit("charge", Math.random() * 96 - 0, Math.random() * 70);
    if (anim.charge === 0) {
      anim.laser = 18; fx("red"); quake(true);
      state.phase = "lose"; renderHUD(); renderPanel();
    }
  }
  if (anim.laser > 0) { anim.laser--; anim.shake = 2; }
  if (anim.dying > 0) {
    anim.dying--;
    anim.shake = 2;
    if (t % 3 === 0) { emit("boom", ...randPt()); for (let i = 0; i < 4; i++) emit("debris", ...randPt()); }
    if (t % 8 === 0) { anim.flash = 1; quake(false); }
    if (anim.dying === 0) {
      anim.forced = 5; anim.flash = 0;
      fx("white"); quake(true);
      emit("ring", 48, 52, { r: 70 }); emit("ring", 48, 52, { r: 45 });
      emit("boom", 48, 50, { r: 16 }); emit("boom", 26, 40, { r: 9 }); emit("boom", 70, 30, { r: 9 });
      for (let i = 0; i < 50; i++) emit("debris", ...randPt());
      setTimeout(() => { state.phase = "win"; renderHUD(); renderPanel(); }, 1800);
    }
  }
}

function sizeRobot() {
  const wrap = document.getElementById("robotWrap").getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const sc = Math.max(1, Math.floor(Math.min(wrap.width * dpr / SW, wrap.height * dpr / SH)));
  view.width = SW * sc; view.height = SH * sc;
  view.style.width = (SW * sc / dpr) + "px"; view.style.height = (SH * sc / dpr) + "px";
}

/* ===================== SCREEN EFFECTS ===================== */
const app = document.querySelector(".app");
function quake(big) {
  if (REDUCED) return;
  app.classList.remove("quake", "quake-big");
  void app.offsetWidth;
  app.classList.add(big ? "quake-big" : "quake");
}
app.addEventListener("animationend", e => { if (e.target === app) app.classList.remove("quake", "quake-big"); });
function fx(kind) {
  if (REDUCED && (kind === "white" || kind === "soft")) return;
  const el = document.createElement("div");
  el.className = "fx " + kind;
  document.body.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}

/* ===================== BACKGROUND ===================== */
const bg = document.getElementById("bg"), bctx = bg.getContext("2d");
let BW = 0, BH = 0, city = [], stars = [];
function sizeBg() {
  BW = Math.ceil(innerWidth / 4); BH = Math.ceil(innerHeight / 4);
  bg.width = BW; bg.height = BH;
  const r = rng(42);
  city = []; stars = [];
  for (const layer of [0, 1]) {
    let x = -3;
    while (x < BW) {
      const w = 6 + Math.floor(r() * 14);
      const h = Math.floor(BH * (layer ? 0.1 + r() * 0.24 : 0.2 + r() * 0.26));
      const wins = [];
      if (layer) for (let wy = BH - h + 3; wy < BH - 2; wy += 3)
        for (let wx = x + 2; wx < x + w - 2; wx += 3)
          if (r() < 0.35) wins.push([wx, wy, r() < 0.3 ? "#ff2246" : "#ffd23f", r() * 100]);
      city.push({ layer, x, w, h, wins, ant: r() < 0.25 });
      x += w + (r() < 0.3 ? 1 : 0);
    }
  }
  for (let i = 0; i < BW * BH / 260; i++) stars.push([Math.floor(r() * BW), Math.floor(r() * BH * 0.55), r() * 100]);
}
function drawBg() {
  g = bctx;
  const bands = ["#0b0716", "#120a1d", "#1a0c22", "#250e24", "#341224", "#461522"];
  const bh = BH / bands.length;
  bands.forEach((c, i) => R(0, Math.floor(i * bh), BW, Math.ceil(bh) + 1, c));
  for (let i = 1; i < bands.length; i++) {
    const y = Math.floor(i * bh);
    for (let x = 0; x < BW; x++) { if (x % 2 === 0) P(x, y - 1, bands[i]); else P(x, y, bands[i - 1]); }
  }
  const t = anim.tick;
  for (const [x, y, ph] of stars) if ((Math.floor(t / 6 + ph) % 9) !== 0) P(x, y, "#5d5277");
  for (const b of city) {
    const c = b.layer ? "#07040c" : "#170e22";
    R(b.x, BH - b.h, b.w, b.h, c);
    if (b.ant) {
      R(b.x + Math.floor(b.w / 2), BH - b.h - 4, 1, 4, c);
      if (b.layer && t % 12 < 6) P(b.x + Math.floor(b.w / 2), BH - b.h - 5, "#ff2246");
    }
    for (const [wx, wy, wc, ph] of b.wins) if ((Math.floor(t / 8 + ph) % 13) !== 0) P(wx, wy, wc);
  }
}

/* ===================== GAUGE ===================== */
const gauge = document.getElementById("gauge");
(function buildGauge() {
  const cx = 90, cy = 92;
  const mix = v => {
    const stops = [[62, 240, 255], [255, 210, 63], [255, 34, 70]];
    const k = (v - 1) / 9, seg = k < 0.5 ? 0 : 1, kk = k < 0.5 ? k * 2 : (k - 0.5) * 2;
    const a = stops[seg], b = stops[seg + 1];
    return `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * kk)).join(",")})`;
  };
  let html = "";
  for (let v = 1; v <= 10; v++) {
    const th = Math.PI - (v - 1) * Math.PI / 9;
    const x1 = cx + 70 * Math.cos(th), y1 = cy - 70 * Math.sin(th);
    const x2 = cx + 84 * Math.cos(th), y2 = cy - 84 * Math.sin(th);
    const lx = cx + 56 * Math.cos(th), ly = cy - 56 * Math.sin(th);
    html += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${mix(v)}" stroke-width="7"/>`;
    html += `<text class="gnum" data-v="${v}" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="9" fill="#9a90b8">${v}</text>`;
  }
  html += `<g id="needle"><polygon points="${cx},${cy - 3} ${cx - 64},${cy} ${cx},${cy + 3}" fill="#ece8f7" stroke="#000" stroke-width="1.5"/></g>`;
  html += `<rect x="${cx - 7}" y="${cy - 7}" width="14" height="14" fill="#3a2f55" stroke="#000" stroke-width="2"/>`;
  gauge.innerHTML = html;
})();
function renderGauge() {
  document.getElementById("needle").style.transform = `rotate(${(state.level - 1) * 20}deg)`;
  gauge.querySelectorAll(".gnum").forEach(t => t.setAttribute("fill", +t.dataset.v === state.level ? "#ffd23f" : "#9a90b8"));
}

/* ===================== HUD & PANEL ===================== */
const $ = id => document.getElementById(id);
const panel = $("panel");
$("bossName").textContent = CFG.bossName || "BOSS";
$("bossSub").textContent = CFG.bossSubtitle || "";

function renderHUD() {
  const cur = hp(), max = maxHp(), pct = (cur / max) * 100;
  $("hpFill").style.width = pct + "%";
  $("hpGhost").style.width = pct + "%";
  $("hpNum").textContent = `${cur} / ${max}`;
  $("hpBox").setAttribute("aria-label", `Vita del boss: ${cur} su ${max}`);
  $("qCount").textContent = {
    setup: "PRONTI", play: `DOMANDA ${pad(state.qi + 1)}/${pad(Q.length)}`,
    dying: "COLPO FINALE", win: "VITTORIA", lose: "SCONFITTA"
  }[state.phase];
  renderGauge();
  const prev = $("hpPrev");
  if (prev) prev.textContent = `${max} punti vita`;
}

function renderPanel() {
  panel.classList.remove("locked");
  if (state.phase === "setup") {
    panel.innerHTML = `
      <p class="eyebrow">${CFG.eyebrow || "Sfida finale"}</p>
      <h1 class="title">Boss finale</h1>
      <p class="lede">${Q.length} domande, quattro opzioni. Ogni voto sulla risposta giusta toglie un punto vita al boss. Potete dividere i voti tra più risposte, ma ogni giocatore deve votare.</p>
      <div class="field">
        <span class="field-label">Giocatori in partita</span>
        <div class="counter big">
          <button class="step" data-act="pl-" aria-label="Un giocatore in meno">−</button>
          <output class="num" id="plNum">${state.players}</output>
          <button class="step" data-act="pl+" aria-label="Un giocatore in più">+</button>
        </div>
      </div>
      <p class="note">Il boss ha <strong id="hpPrev">${maxHp()} punti vita</strong>, su ${totalVotes()} voti in gioco.</p>
      <div class="tally"><span></span><button class="attack" data-act="start">Risveglia il boss</button></div>`;
    return;
  }
  if (state.phase === "play" || state.phase === "dying") {
    const q = Q[state.qi];
    panel.innerHTML = `
      <p class="eyebrow">Domanda ${state.qi + 1} di ${Q.length}</p>
      <h2 class="qtext">${q.q}</h2>
      <div class="opts">
        ${q.options.map((o, i) => `
          <div class="opt" id="opt${i}">
            <span class="letter">${LETTERS[i]}</span>
            <span class="otext">${o}</span>
            <div class="counter">
              <button class="step" data-act="v-" data-i="${i}" aria-label="Togli un voto a ${LETTERS[i]}">−</button>
              <output class="num" id="vn${i}">0</output>
              <button class="step" data-act="v+" data-i="${i}" aria-label="Aggiungi un voto a ${LETTERS[i]}">+</button>
            </div>
          </div>`).join("")}
      </div>
      <div class="tally">
        <div class="tally-info">
          <span class="tally-text" id="tallyText"></span>
          <div class="pips" id="pips"></div>
        </div>
        <button class="attack" data-act="attack" id="attackBtn">Attacca</button>
      </div>`;
    updateVotes();
    if (state.phase === "dying") panel.classList.add("locked");
    return;
  }
  const won = state.phase === "win";
  const correct = state.damage, cast = state.played * state.players;
  const pct = cast ? Math.round(correct / cast * 100) : 0;
  panel.innerHTML = `
    <p class="eyebrow">Partita conclusa</p>
    <h1 class="title ${won ? "win" : ""}">${won ? "Boss sconfitto" : "L'AI ha vinto"}</h1>
    <p class="lede">${won
      ? "La classe ha mandato in pezzi il boss. Il mondo è salvo, per oggi."
      : `Al boss restavano ${hp()} punti vita. Il mondo è suo, almeno fino alla prossima partita.`}</p>
    <div class="stats">
      <div class="stat"><span class="stat-k">VOTI CORRETTI</span><span class="stat-v">${correct}/${cast}</span></div>
      <div class="stat"><span class="stat-k">PRECISIONE</span><span class="stat-v">${pct}%</span></div>
      <div class="stat"><span class="stat-k">DOMANDE GIOCATE</span><span class="stat-v">${state.played}/${Q.length}</span></div>
    </div>
    <div class="tally"><span></span><button class="attack" data-act="again">Nuova partita</button></div>`;
}

function updateVotes() {
  const n = state.players, sum = sumVotes();
  state.votes.forEach((v, i) => {
    $("vn" + i).textContent = v;
    $("opt" + i).classList.toggle("voted", v > 0);
    panel.querySelector(`[data-act="v-"][data-i="${i}"]`).disabled = v === 0;
    panel.querySelector(`[data-act="v+"][data-i="${i}"]`).disabled = sum >= n;
  });
  $("tallyText").innerHTML = `VOTI <b>${sum}</b> / ${n}`;
  $("pips").innerHTML = Array.from({ length: n }, (_, i) => `<span class="pip${i < sum ? " on" : ""}"></span>`).join("");
  $("attackBtn").disabled = sum !== n;
}

/* ===================== GAME FLOW ===================== */
function popup(text, zero) {
  const el = document.createElement("div");
  el.className = "pop" + (zero ? " zero" : "");
  el.textContent = text;
  $("popups").appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}
function resetAnim() {
  Object.assign(anim, { forced: null, dying: 0, laugh: 0, intro: 0, charge: 0, laser: 0, lastStage: 0, fall: 0, vfall: 0, landed: false, shake: 0, flash: 0 });
  parts = [];
}

function startGame() {
  Object.assign(state, { phase: "play", damage: 0, qi: 0, played: 0, votes: [0, 0, 0, 0], busy: false });
  resetAnim();
  anim.intro = 22;
  renderHUD(); renderPanel();
}

function attack() {
  if (state.busy || state.phase !== "play" || sumVotes() !== state.players) return;
  state.busy = true;
  panel.classList.add("locked");
  const dmg = state.votes[Q[state.qi].correct];
  state.damage += dmg; state.played++;
  if (dmg > 0) {
    anim.shake = 8; anim.flash = 2;
    quake(dmg >= state.players * 0.7);
    popup("-" + dmg);
    const [hx, hy] = randPt();
    emit("boom", hx, hy, { r: 4 + Math.min(6, dmg / 3) });
    for (let i = 0; i < Math.min(24, 4 + dmg); i++) emit("debris", ...randPt());
    for (let i = 0; i < 8; i++) emit("spark", hx, hy);
  } else {
    anim.laugh = 16;
    fx("vig");
    popup("0", true);
  }
  renderHUD();
  setTimeout(() => {
    if (hp() <= 0) return victory();
    if (state.qi >= Q.length - 1) return defeat();
    state.qi++; state.votes = [0, 0, 0, 0]; state.busy = false;
    renderHUD(); renderPanel();
  }, 1300);
}

function victory() {
  state.phase = "dying"; state.busy = true;
  anim.forced = Math.max(stageNow(), 3); anim.dying = 48;
  renderHUD(); panel.classList.add("locked");
}
function defeat() {
  state.busy = true;
  anim.charge = 18;
  panel.classList.add("locked");
}

function setLevel(d) {
  state.level = Math.min(10, Math.max(1, state.level + d));
  renderHUD();
  if (state.phase === "play" && !state.busy && hp() <= 0) victory();
}

panel.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === "pl-" || act === "pl+") {
    state.players = Math.min(60, Math.max(1, state.players + (act === "pl+" ? 1 : -1)));
    renderHUD(); renderPanel();
    panel.querySelector(`[data-act="${act}"]`).focus();
  } else if (act === "v+" && sumVotes() < state.players) { state.votes[i]++; updateVotes(); }
  else if (act === "v-" && state.votes[i] > 0) { state.votes[i]--; updateVotes(); }
  else if (act === "start") startGame();
  else if (act === "attack") attack();
  else if (act === "again") {
    Object.assign(state, { phase: "setup", damage: 0, qi: 0, played: 0, votes: [0, 0, 0, 0], busy: false });
    resetAnim();
    renderHUD(); renderPanel();
  }
});
$("up").addEventListener("click", () => setLevel(1));
$("down").addEventListener("click", () => setLevel(-1));

/* ===================== LOOP ===================== */
function resize() { sizeBg(); sizeRobot(); drawBg(); }
addEventListener("resize", resize);
if ("ResizeObserver" in window) new ResizeObserver(sizeRobot).observe($("robotWrap"));

let last = 0;
function loop(now) {
  if (now - last >= 1000 / 12) {
    last = now; anim.tick++;
    render();
    if (anim.tick % 3 === 0) drawBg();
  }
  requestAnimationFrame(loop);
}
resize(); renderHUD(); renderPanel(); render();
requestAnimationFrame(loop);
})();
</script>
